<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgAmbient" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#0c1a3a" />
      <stop offset="45%" stop-color="#060c1d" />
      <stop offset="85%" stop-color="#020409" />
      <stop offset="100%" stop-color="#010205" />
    </radialGradient>

    <radialGradient id="glowCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.25" />
      <stop offset="40%" stop-color="#2563eb" stop-opacity="0.12" />
      <stop offset="80%" stop-color="#1e1b4b" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Linear Accents -->
    <linearGradient id="cyanBlueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="neonBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0" />
      <stop offset="30%" stop-color="#00f0ff" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0" />
    </linearGradient>

    <!-- Filters -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="coreGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.35" />
      <circle cx="60" cy="0" r="1.5" fill="#00f0ff" fill-opacity="0.3" />
    </pattern>
  </defs>

  <!-- Deep Background -->
  <rect width="1600" height="900" fill="url(#bgAmbient)" />
  
  <!-- Subtle Grid Overlay -->
  <rect width="1600" height="900" fill="url(#cyberGrid)" />

  <!-- Atmospheric Glow Aura -->
  <ellipse cx="800" cy="450" rx="650" ry="380" fill="url(#glowCenter)" />

  <!-- Constellation Nodes & Synaptic Neural Net -->
  <g stroke="#0284c7" stroke-width="1.2" stroke-opacity="0.3" fill="none">
    <line x1="180" y1="200" x2="320" y2="280" />
    <line x1="320" y1="280" x2="480" y2="240" />
    <line x1="480" y1="240" x2="620" y2="350" />
    <line x1="320" y1="280" x2="260" y2="440" />
    <line x1="260" y1="440" x2="390" y2="520" />
    <line x1="390" y1="520" x2="520" y2="460" />
    <line x1="260" y1="440" x2="160" y2="580" />
    <line x1="160" y1="580" x2="310" y2="680" />

    <line x1="1420" y1="200" x2="1280" y2="280" />
    <line x1="1280" y1="280" x2="1120" y2="240" />
    <line x1="1120" y1="240" x2="980" y2="350" />
    <line x1="1280" y1="280" x2="1340" y2="440" />
    <line x1="1340" y1="440" x2="1210" y2="520" />
    <line x1="1210" y1="520" x2="1080" y2="460" />
    <line x1="1340" y1="440" x2="1440" y2="580" />
    <line x1="1440" y1="580" x2="1290" y2="680" />
  </g>

  <!-- Node Dots & Pulses -->
  <g fill="#00f0ff" opacity="0.8">
    <circle cx="180" cy="200" r="4" />
    <circle cx="320" cy="280" r="6" fill="#38bdf8" />
    <circle cx="480" cy="240" r="5" />
    <circle cx="260" cy="440" r="7" fill="#ffffff" filter="url(#softGlow)" />
    <circle cx="390" cy="520" r="5" />
    <circle cx="520" cy="460" r="6" />
    <circle cx="160" cy="580" r="5" />
    <circle cx="310" cy="680" r="6" />

    <circle cx="1420" cy="200" r="4" />
    <circle cx="1280" cy="280" r="6" fill="#38bdf8" />
    <circle cx="1120" cy="240" r="5" />
    <circle cx="1340" cy="440" r="7" fill="#ffffff" filter="url(#softGlow)" />
    <circle cx="1210" cy="520" r="5" />
    <circle cx="1080" cy="460" r="6" />
    <circle cx="1440" cy="580" r="5" />
    <circle cx="1290" cy="680" r="6" />
  </g>

  <!-- Central Technical Geometric Ring Frame -->
  <g transform="translate(800, 370)">
    <!-- Outer dashed telemetry ring -->
    <circle cx="0" cy="0" r="160" fill="none" stroke="#00f0ff" stroke-width="1.5" stroke-opacity="0.25" stroke-dasharray="8 6" />
    <circle cx="0" cy="0" r="175" fill="none" stroke="#2563eb" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="16 12" />
    
    <!-- Central Hex Core Indicator -->
    <polygon points="0,-110 95,-55 95,55 0,110 -95,55 -95,-55" fill="#040b1e" fill-opacity="0.7" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.4" />

    <!-- Core Logo Monogram K -->
    <g transform="translate(-45, -55) scale(0.45)">
      <!-- Vertical Bar -->
      <rect x="30" y="20" width="34" height="190" rx="10" fill="url(#cyanBlueGrad)" filter="url(#softGlow)" />
      <!-- Upper Branch -->
      <path d="M 64 110 L 138 34 C 146 26 158 26 166 34 L 172 40 C 180 48 180 60 172 68 L 106 128 Z" fill="url(#cyanBlueGrad)" />
      <!-- Lower Branch -->
      <path d="M 96 116 L 160 186 C 168 194 168 206 160 214 L 154 220 C 146 228 134 228 126 220 L 64 140 Z" fill="#2563eb" />
      <circle cx="86" cy="120" r="12" fill="#ffffff" filter="url(#softGlow)" />
    </g>
  </g>

  <!-- Header Category / Pill Badge -->
  <g transform="translate(800, 140)">
    <rect x="-240" y="-20" width="480" height="40" rx="20" fill="#071228" stroke="#00f0ff" stroke-width="1.2" stroke-opacity="0.5" />
    <circle cx="-210" cy="0" r="5" fill="#00f0ff" />
    <text x="0" y="6" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="3">
      PLATAFORMA UNIVERSITARIA &amp; IA // FICCT - UAGRM
    </text>
  </g>

  <!-- MAIN BRAND TITLE: "K I R I S" -->
  <g transform="translate(800, 600)">
    <text x="0" y="0" font-family="'Outfit', 'Urbanist', sans-serif" font-size="94" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="14" filter="url(#coreGlow)">
      KIRIS
    </text>
    <text x="0" y="0" font-family="'Outfit', 'Urbanist', sans-serif" font-size="94" font-weight="900" fill="url(#cyanBlueGrad)" text-anchor="middle" letter-spacing="14">
      KIRIS
    </text>
  </g>

  <!-- Divider Line with Neon Pulse -->
  <rect x="420" y="635" width="760" height="2" fill="url(#neonBar)" />

  <!-- Slogan Typography -->
  <g transform="translate(800, 685)">
    <text x="0" y="0" font-family="'Outfit', 'Urbanist', sans-serif" font-size="24" font-weight="700" fill="#f8fafc" text-anchor="middle" letter-spacing="4">
      INNOVACIÓN EN RAZONAMIENTO E INTELIGENCIA DE SISTEMAS
    </text>
  </g>

  <!-- Secondary Academic Subtitle -->
  <g transform="translate(800, 725)">
    <text x="0" y="0" font-family="'Urbanist', sans-serif" font-size="16" font-weight="500" fill="#94a3b8" text-anchor="middle" letter-spacing="1.5">
      Repositorio de Auxiliaturas Universitarias • Google Drive • Inteligencia Artificial para el Día a Día
    </text>
  </g>

  <!-- Author Tag Dossier Footer -->
  <g transform="translate(800, 790)">
    <rect x="-260" y="-18" width="520" height="36" rx="10" fill="#030712" stroke="#1e293b" stroke-width="1" />
    <text x="0" y="5" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#38bdf8" text-anchor="middle" letter-spacing="2">
      MARCO ALEJANDRO LOPEZ VELASQUEZ • SANTA CRUZ, BOLIVIA
    </text>
  </g>

  <!-- Border Frame Corner Accents -->
  <path d="M 30 70 L 30 30 L 70 30" fill="none" stroke="#00f0ff" stroke-width="3" stroke-linecap="round" />
  <path d="M 1570 70 L 1570 30 L 1530 30" fill="none" stroke="#00f0ff" stroke-width="3" stroke-linecap="round" />
  <path d="M 30 830 L 30 870 L 70 870" fill="none" stroke="#00f0ff" stroke-width="3" stroke-linecap="round" />
  <path d="M 1570 830 L 1570 870 L 1530 870" fill="none" stroke="#00f0ff" stroke-width="3" stroke-linecap="round" />
</svg>
