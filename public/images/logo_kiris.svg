<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1329" />
      <stop offset="50%" stop-color="#050b18" />
      <stop offset="100%" stop-color="#02050c" />
    </linearGradient>

    <!-- Primary Cyan/Blue Gradient -->
    <linearGradient id="kirisCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Deep Blue Accent Gradient -->
    <linearGradient id="kirisBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Rounded Shield Container -->
  <rect x="10" y="10" width="180" height="180" rx="44" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="3" />
  
  <!-- Subtle Circuit Pathways -->
  <path d="M 30 60 L 60 60 L 80 80" stroke="#0ea5e9" stroke-width="1.5" stroke-opacity="0.3" fill="none" stroke-dasharray="3 3" />
  <path d="M 170 140 L 140 140 L 120 120" stroke="#0ea5e9" stroke-width="1.5" stroke-opacity="0.3" fill="none" stroke-dasharray="3 3" />
  <circle cx="30" cy="60" r="3" fill="#38bdf8" fill-opacity="0.4" />
  <circle cx="170" cy="140" r="3" fill="#38bdf8" fill-opacity="0.4" />

  <!-- Inner Tech Ring -->
  <circle cx="100" cy="100" r="72" fill="none" stroke="#00f0ff" stroke-width="1.2" stroke-opacity="0.25" stroke-dasharray="8 6" />

  <!-- The "K" Geometric Monogram (KIRIS) -->
  <!-- Vertical Pillar -->
  <rect x="58" y="44" width="22" height="112" rx="6" fill="url(#kirisCyanGrad)" filter="url(#neonGlow)" />
  <rect x="62" y="48" width="6" height="104" rx="3" fill="#ffffff" fill-opacity="0.5" />

  <!-- Top Diagonal Branch of K -->
  <path d="M 80 102 L 128 50 C 132 46 139 46 143 50 L 146 53 C 150 57 150 64 146 68 L 106 112 Z" 
        fill="url(#kirisCyanGrad)" filter="url(#neonGlow)" />

  <!-- Bottom Diagonal Branch of K -->
  <path d="M 98 100 L 138 144 C 142 148 142 155 138 159 L 135 162 C 131 166 124 166 120 162 L 78 116 Z" 
        fill="url(#kirisBlueGrad)" filter="url(#neonGlow)" />

  <!-- Central Synaptic Core Node -->
  <circle cx="94" cy="104" r="8" fill="#ffffff" filter="url(#neonGlow)" />
  <circle cx="94" cy="104" r="4" fill="#00f0ff" />

  <!-- Micro Orbit Data Beads -->
  <circle cx="140" cy="56" r="3" fill="#ffffff" />
  <circle cx="132" cy="154" r="3" fill="#38bdf8" />
</svg>
